<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#032d60">
  <title>Procus — Procurement workspace</title>
  <link rel="stylesheet" href="/src/styles.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
<div id="procus-workspace">
  <header class="p-globalheader">
    <span class="p-brand">procus<span aria-hidden="true">.</span></span>
    <span class="p-globalheader__divider" aria-hidden="true"></span>
    <span class="p-globalheader__app">Procurement</span>
    <div class="p-globalheader__right">
      <span class="p-tag" title="Every figure in this prototype is fictional">Sample data</span>
      <span class="p-user"><span class="p-avatar">AK</span><span class="p-user__name">Alex Kim<small>Procurement manager</small></span></span>
    </div>
  </header>

  <aside class="p-sidebar">
    <nav class="p-nav" aria-label="Workspace views">
      <button type="button" class="p-tab" data-view="overview" aria-current="page">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="8" rx="1.2"/><rect x="11" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="13" width="6" height="4" rx="1.2"/><rect x="11" y="10" width="6" height="7" rx="1.2"/></svg>
        <span>Overview</span></button>
      <button type="button" class="p-tab" data-view="products">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2.5 6.5 3.5v8L10 17.5 3.5 14V6L10 2.5Z"/><path d="M10 10.5 16.5 6M10 10.5 3.5 6m6.5 4.5v7"/></svg>
        <span>Parts &amp; suppliers</span><span class="p-nav__count" data-count="products"></span></button>
      <button type="button" class="p-tab" data-view="workflow">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="4.5" height="12" rx="1.2"/><rect x="7.8" y="4" width="4.5" height="12" rx="1.2"/><rect x="13.1" y="4" width="4.5" height="12" rx="1.2"/></svg>
        <span>Workflow</span><span class="p-nav__count" data-count="workflow"></span></button>
      <button type="button" class="p-tab" data-view="agents">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="6" width="13" height="9" rx="2.5"/><path d="M10 6V3M7 10.2h.01M13 10.2h.01M7.8 12.6h4.4"/></svg>
        <span>Agents</span><span class="p-nav__count" data-count="agents"></span></button>
      <button type="button" class="p-tab" data-view="spend">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5V3.5M3 16.5h14"/><path d="m6 13 3.5-4 3 2.5L17 6"/></svg>
        <span>Spend</span></button>
    </nav>
  </aside>

  <main class="p-main">
    <header class="p-pagehead" id="p-pagehead"></header>
    <div id="p-view"></div>
    <noscript><p class="p-note">This interactive prototype requires JavaScript.</p></noscript>
  </main>
</div>
</body>
</html>
